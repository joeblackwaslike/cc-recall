# cc-recall-watchdog configuration — sourced by bin/*.sh
# Override any value by editing here; all are plain shell assignments.

# --- Paths -------------------------------------------------------------------
CC_RECALL_DIR="${CC_RECALL_DIR:-$HOME/.claude/cc-recall}"
CC_RECALL_METRICS_DIR="${CC_RECALL_METRICS_DIR:-$CC_RECALL_DIR/metrics}"
CC_RECALL_ADOPTION_FILE="${CC_RECALL_ADOPTION_FILE:-$CC_RECALL_METRICS_DIR/adoption.jsonl}"
CC_RECALL_SIDECAR_DB="${CC_RECALL_SIDECAR_DB:-$CC_RECALL_DIR/index.db}"

# State dir (this watchdog's own bookkeeping, kept separate from cc-recall's own state)
STATE_DIR="${STATE_DIR:-$HOME/.cc-recall-watchdog}"

# Tool absolute paths (launchd has a minimal PATH; resolve explicitly)
JQ="${JQ:-$(command -v jq || echo /usr/bin/jq)}"
# Resolve from PATH so it tracks the active install (avoids homebrew/nvm version skew).
OPENCLAW="${OPENCLAW:-$(command -v openclaw 2>/dev/null || echo /opt/homebrew/bin/openclaw)}"

# --- Thresholds (light tick) --------------------------------------------------
# Independent of cc-recall's own in-process spawn-rate ceiling (src/metrics/spawn-ceiling.ts,
# default 30/rolling-hour) — this watchdog does not trust that gate to always be running (that
# was exactly Incident B: the fix shipped to GitHub but never reached the running plugin cache).
# Set higher than the app-side default so a healthy, gated system never trips it; tripping means
# the gate itself is missing, stale, or bypassed.
SPAWN_RATE_WINDOW_SECS="${SPAWN_RATE_WINDOW_SECS:-3600}"   # rolling window matching the app gate
SPAWN_RATE_ALERT_MAX="${SPAWN_RATE_ALERT_MAX:-45}"         # enrichment_spawn events per window

# Sidecar (index.db) growth between light ticks (~5 min). A sustained jump here means records
# are being written far faster than a human is generating sessions.
SIDECAR_GROWTH_ALERT_MB="${SIDECAR_GROWTH_ALERT_MB:-25}"

# --- Approval round-trip -----------------------------------------------------
APPROVAL_EXPIRY_HOURS="${APPROVAL_EXPIRY_HOURS:-24}"
CIRCUIT_BREAKER_FAILS="${CIRCUIT_BREAKER_FAILS:-3}" # consecutive elevated ticks before escalating

# --- Notifications -----------------------------------------------------------
TELEGRAM_CHANNEL="${TELEGRAM_CHANNEL:-telegram}"
OWNER_FILE="${OWNER_FILE:-$STATE_DIR/owner.json}"  # same shape as claude-mem-watchdog's; not self-bootstrapped here (no bridge) — set manually, see README
NOTIFY_PREFIX="${NOTIFY_PREFIX:-🐕 cc-recall-watchdog}"
